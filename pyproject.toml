[project]
name = "binance-algo"
version = "0.6.0"
description = "Auditable Binance USD-M Futures data and research foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "binance-algo contributors" }]
dependencies = [
  "aiohttp>=3.11",
  "duckdb>=1.3",
  "numpy>=2.2",
  "orjson>=3.10",
  "polars>=1.30",
  "prometheus-client>=0.21",
  "pyarrow>=20",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
  "python-dotenv>=1.1",
  "pyyaml>=6.0.2",
  "rich>=14",
  "structlog>=25",
  "typer>=0.16",
]

[project.scripts]
binance-algo = "binance_algo.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.130",
  "mypy>=1.16",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-pyyaml>=6.0.12.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binance_algo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC240", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
packages = ["binance_algo"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "network: reaches a real external service and is excluded from the default quality gate",
]

[tool.coverage.run]
branch = true
source = ["binance_algo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
