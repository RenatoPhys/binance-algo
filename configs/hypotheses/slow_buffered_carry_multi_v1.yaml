hypothesis_id: HYP-SLOW-BUFFERED-CARRY-MULTI-0001
title: Longer holding buffers may improve the net Sharpe of multi-horizon carry
mechanism: >-
  The frozen 60/30/10 carry, 7-day strength and 14-day strength portfolio already exceeded Sharpe
  one with a 48-hour buffer. Holding the same causal targets for 72, 96 or 168 hours may reduce
  explicit turnover costs and short-lived ranking reversals without changing signals, exposure or
  sleeve weights.
expected_direction: similar gross edge with lower turnover and net Sharpe above one
expected_horizon: 72- to 168-hour buffered target weights with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
