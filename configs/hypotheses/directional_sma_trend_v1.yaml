hypothesis_id: HYP-DIRECTIONAL-SMA-TREND-0001
title: Absolute multi-day SMA trends may diversify market-neutral funding carry
mechanism: >-
  A 24-hour versus 168-hour causal SMA measures the absolute trend of each asset rather than its
  rank against the other assets. Long positions follow positive trends and short positions follow
  negative trends. Inverse-volatility sizing and multi-day rebalance buffers should control risk
  and turnover while retaining directional persistence.
expected_direction: long positive individual trends and short negative individual trends
expected_horizon: 24h to 168h holding intervals with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
