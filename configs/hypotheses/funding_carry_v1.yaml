hypothesis_id: HYP-FUNDING-CARRY-0001
title: Extreme perpetual funding may support a cross-sectional carry score
mechanism: >-
  Relatively negative published funding may compensate long exposure while relatively positive
  funding may compensate short exposure. Residual momentum is only a configurable confirmation,
  and all exposure and risk constraints remain in the portfolio policy.
expected_direction: long relatively negative funding and short relatively positive funding
expected_horizon: 1h
target_universe: fixed point-in-time Binance USD-M perpetual research universe
preregistered_success_criteria:
  purpose: discovery_only
  cost_stress_multiplier: "1.5"
  signal_delay_bars: 1
  promotion_allowed: false
status: READY
notes: >-
  Initial fixed, non-supervised specification. Results, including negative results, are exploratory
  evidence and do not authorize promotion or trading.
