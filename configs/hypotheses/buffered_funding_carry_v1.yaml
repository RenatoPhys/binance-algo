hypothesis_id: HYP-BUFFERED-FUNDING-CARRY-0001
title: Funding carry may survive costs when rebalanced near funding cycles
mechanism: >-
  Published perpetual funding changes far less frequently than hourly portfolio risk estimates.
  Holding a funding-carry ranking for 8, 24 or 48 hours may preserve the compensated direction
  while avoiding cost-dominated hourly resizing. A small fixed residual-momentum confirmation
  breaks funding ties without becoming the primary signal.
expected_direction: long relatively negative funding and short relatively positive funding
expected_horizon: 8h to 48h holding intervals with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
preregistered_success_criteria:
  development_end: "2024-08-27"
  development_net_total_return_min: "0.0"
  development_net_sharpe_min: "0.5"
  development_cost_1_5x_total_return_min: "0.0"
  development_signal_delay_total_return_min: "0.0"
  final_oos_days: 728
