  final_net_sharpe_min: "0.5"
  final_cost_1_5x_total_return_min: "0.0"
  promotion_allowed: false
status: READY
notes: >-
  The funding score is fixed before this screen. Only economically motivated holding intervals and
  two hysteresis bands are varied. At most one candidate may be frozen for final OOS confirmation.
