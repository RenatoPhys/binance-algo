hypothesis_id: HYP-RELATIVE-STRENGTH-0001
title: Multi-day cross-sectional strength may persist independently of market direction
mechanism: >-
  Cumulative closed-hour returns rank BTC, ETH and SOL over conventional 7, 14 and 30-day windows.
  A buffered beta-aware neutral portfolio buys the strongest asset and sells the weakest, removing
  most common crypto-market direction while retaining persistent relative leadership.
expected_direction: long the strongest trailing return and short the weakest
expected_horizon: one to two-day holding intervals with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
