hypothesis_id: HYP-CARRY-MULTI-MODEL-AVERAGE-0001
title: Averaging the preregistered multi-horizon carry weights may reduce selection risk
mechanism: >-
  The arithmetic mean of all six originally preregistered convex portfolios is used instead of
  selecting the highest-Sharpe member. This fixes the carry, fast-strength and slow-strength
  weights at 2/3, 1/6 and 1/6. Model averaging may retain the broad profitable neighborhood while
  reducing sensitivity to the selected 60/30/10 point.
expected_direction: stable net carry and trend returns with Sharpe above one
expected_horizon: 48-hour buffered target weights with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
preregistered_success_criteria:
  development_end: "2024-08-27"
  development_net_total_return_min: "0.0"
