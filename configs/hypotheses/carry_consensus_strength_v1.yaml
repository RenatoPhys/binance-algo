hypothesis_id: HYP-CARRY-CONSENSUS-STRENGTH-0001
title: Agreement between fast and slow relative strength may improve the carry ensemble
mechanism: >-
  A neutral strength sleeve is active only when the 168-hour and 336-hour cross-sectional trends
  have the same sign. Disagreement maps to zero before portfolio construction. Blending this
  persistent consensus with funding carry may remove transient ranking reversals while retaining
  market neutrality and the existing 48-hour turnover buffer.
expected_direction: positive carry returns with fewer relative-strength whipsaws and Sharpe above one
expected_horizon: 48-hour buffered target weights with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
