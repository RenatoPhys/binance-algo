hypothesis_id: HYP-CARRY-MULTI-REGIME-0001
title: A small orthogonal market-regime sleeve may improve multi-horizon carry risk adjustment
mechanism: >-
  The frozen 60/30/10 neutral carry core is blended with a long/flat 168/720-hour market-regime
  trend sleeve. Their development return correlation was 0.007 before this hypothesis was
  registered. A small convex allocation to the directional sleeve may reduce dependence on the
  carry return path without increasing gross exposure or changing the execution model.
expected_direction: higher net risk-adjusted return than either sleeve alone
expected_horizon: 48-hour buffered target weights with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
