  final_net_total_return_min: "0.0"
  final_net_sharpe_min: "0.30"
  final_cost_1_5x_total_return_min: "0.0"
  promotion_allowed: false
status: READY
notes: >-
  Entry windows of 168/336/720 hours, a 72-hour exit and 24/72-hour rebalance intervals are frozen
