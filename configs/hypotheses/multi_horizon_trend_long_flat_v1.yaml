hypothesis_id: HYP-MULTI-HORIZON-TREND-LONG-FLAT-0001
title: Slow multi-horizon trend voting may capture crypto upside while avoiding short squeezes
mechanism: >-
  A convex vote of trailing 3-, 14- and 30-day returns should require agreement across trend
  horizons before holding risk. Long/flat positioning avoids the unstable short leg observed in
  prior directional SMA and Donchian screens, while 72-hour buffering limits turnover.
expected_direction: positive net returns concentrated in persistent upward trends
expected_horizon: 72-hour buffered positions with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
