hypothesis_id: HYP-DIRECTIONAL-DONCHIAN-0001
title: Stateful price breakouts may diversify carry with fewer trend whipsaws
mechanism: >-
  Each asset enters long above its prior Donchian high and short below its prior Donchian low,
  using only closed hourly returns. Positions persist until an opposite entry or a shorter exit
  channel is crossed. Explicit state and buffered inverse-volatility sizing may retain large trends
  while avoiding the continuous weak signals that reduced SMA trend quality.
expected_direction: long confirmed upside breakouts and short confirmed downside breakouts
expected_horizon: one to 30-day trend episodes with daily or three-day portfolio updates
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
