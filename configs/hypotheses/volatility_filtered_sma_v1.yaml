  final_signal_delay_total_return_min: "0.0"
  promotion_allowed: false
status: READY
notes: >-
  The volatility threshold is recomputed from each expanding training window. The development grid
  contains only median, two-thirds and upper-quartile feature thresholds. At most one candidate may
  be frozen for final two-year OOS confirmation.
