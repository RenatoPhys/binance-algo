hypothesis_id: HYP-LINEAR-CROSS-SECTIONAL-0001
title: Stable combinations of causal market features may forecast relative returns
mechanism: >-
  A training-only ridge model combines medium-horizon residual momentum, volatility, range,
  relative volume and taker imbalance into a cross-sectional forecast. Cross-sectional feature
  normalization and hourly target demeaning remove market-wide levels, while regularization
  limits unstable coefficients.
  A buffered market-neutral portfolio holds rankings for 24 or 48 hours to control turnover.
expected_direction: long the highest forecast relative return and short the lowest
expected_horizon: 24h to 48h holding intervals with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
preregistered_success_criteria:
