  promotion_allowed: false
status: READY
notes: >-
  The six-feature model and its hourly demeaned return target are fixed before the screen. Only
  three
  ridge penalties and two economically interpretable holding intervals are varied. At most one
  candidate may be frozen for the untouched final OOS; failure promotes no candidate.
