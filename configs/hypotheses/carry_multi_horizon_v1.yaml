hypothesis_id: HYP-CARRY-MULTIHORIZON-0001
title: Funding carry diversified across seven- and fourteen-day relative strength
mechanism: >-
  Buffered funding carry was profitable after stressed costs in development, while seven- and
  fourteen-day cross-sectional relative strength were both profitable and approximately
  uncorrelated with carry returns. Combining independently constructed neutral target weights
  should retain the carry premium while reducing dependence on one trend horizon.
expected_direction: positive net returns from carry with lower single-horizon concentration
expected_horizon: 48-hour buffered sleeve updates with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
