hypothesis_id: HYP-CARRY-DUAL-TREND-0001
title: Funding carry diversified by price-strength and SMA-trend sleeves
mechanism: >-
  Buffered funding carry, seven-day cross-sectional relative strength and a 12/168-hour SMA
  crossover were separately profitable in the development sample. Carry returns had near-zero
  correlation with both price sleeves, so a convex combination of independently constructed
  neutral target weights may improve stability without increasing gross exposure.
expected_direction: positive net returns with less dependence on funding carry alone
expected_horizon: 48-hour buffered sleeve updates with hourly mark-to-market
target_universe: fixed point-in-time BTCUSDT, ETHUSDT and SOLUSDT research universe
preregistered_success_criteria:
  development_end: "2024-08-27"
  development_net_total_return_min: "0.0"
  development_net_sharpe_min: "0.90"
  development_cost_1_5x_total_return_min: "0.0"
  development_signal_delay_total_return_min: "0.0"
  development_profitable_weight_variants_min: 4
  final_oos_days: 728
  final_net_total_return_min: "0.0"
  final_net_sharpe_min: "0.50"
  final_cost_1_5x_total_return_min: "0.0"
  promotion_allowed: false
status: READY
notes: >-
  The carry signal, 168-hour relative-strength horizon, 12/168-hour SMA pair, 48-hour rebalance
  and six convex weight combinations are frozen before this campaign. At most one development
  winner may be evaluated on the final two-year development OOS; it is not a lockbox.
