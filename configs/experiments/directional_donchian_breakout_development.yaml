campaign:
  name: directional_donchian_breakout_v1_development
  description: >-
    Development-only screen of stateful absolute Donchian breakouts before the final two-year OOS.
  hypothesis_id: HYP-DIRECTIONAL-DONCHIAN-0001
  artifact_policy: summary
  max_trials: 6

dataset:
  manifest: var/data/gold/binance/usdm/research_dataset/version=5f83d3d2f1d74139/dataset.json

feature_set:
  name: phase3_baseline_features
  version: "1"

label:
  name: gross_forward_return_1h
  version: "1"
  horizon_minutes: 60

strategy:
  name: donchian_breakout
  version: "1"
  fixed:
    exit_window_hours: 72
  grid:
    entry_window_hours: [168, 336, 720]

portfolio:
  name: buffered_directional
  version: "1"
  fixed:
    signal_threshold: 0.0
    gross_exposure: 0.50
    annual_volatility_target: 0.15
    max_symbol_weight: 0.25
  grid:
    rebalance_interval_hours: [24, 72]

execution:
  name: bar_next_open
  version: "1"
  fixed: {}

costs:
  name: configured_taker
  version: "1"
  fixed:
    cost_multiplier: 1.0

validation:
  profile: discovery
  split_plan: expanding_walk_forward_v1
  train_days: 365
  test_days: 14
  embargo_bars: 1
  stress_cost_multipliers: [1.5]
  stress_signal_delay_bars: [1]

runner:
  max_workers: 3
  fail_fast: false
  resume: true
