campaign:
  name: volatility_filtered_sma_v1_development_v3
  description: >-
    Development-only screen ending before the final two-year OOS. A raw 12-hour versus 168-hour
    SMA trend is active only below a volatility threshold fitted from each fold's training features.
    This v3 preserves the preregistered grid after correcting analytical namespace projection in
    both the shared engine and the campaign runner.
  hypothesis_id: HYP-VOL-FILTERED-SMA-0001
  artifact_policy: summary
  max_trials: 3

dataset:
  manifest: var/data/gold/binance/usdm/research_dataset/version=5f83d3d2f1d74139/dataset.json

feature_set:
  name: phase3_baseline_features
  version: "1"

label:
  name: gross_forward_return_1h
  version: "1"
  horizon_minutes: 60

strategy:
  name: volatility_filtered_sma
  version: "1"
  fixed:
    fast_window_hours: 12
    slow_window_hours: 168
  grid:
    maximum_volatility_quantile: [0.50, 0.67, 0.75]

portfolio:
  name: buffered_neutral_long_short
  version: "1"
  fixed:
    minimum_score_spread: 0.000000001
    no_trade_score_band: 0.0
    rebalance_interval_hours: 24
    gross_exposure: 0.50
    annual_volatility_target: 0.15
    max_symbol_weight: 0.25

execution:
  name: bar_next_open
  version: "1"
  fixed: {}

costs:
  name: configured_taker
  version: "1"
  fixed:
    cost_multiplier: 1.0

validation:
  profile: discovery
  split_plan: expanding_walk_forward_v1
  train_days: 365
  test_days: 14
  embargo_bars: 1
  stress_cost_multipliers: [1.5]
  stress_signal_delay_bars: [1]

runner:
  max_workers: 3
  fail_fast: false
  resume: true
