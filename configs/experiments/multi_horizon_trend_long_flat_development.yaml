campaign:
  name: multi_horizon_trend_long_flat_v1_development
  description: >-
    Four preregistered convex votes of 3-, 14- and 30-day time-series trend, using a slow
    volatility-scaled long/flat portfolio before the final two-year OOS.
  hypothesis_id: HYP-MULTI-HORIZON-TREND-LONG-FLAT-0001
  artifact_policy: summary
  max_trials: 4

dataset:
  manifest: var/data/gold/binance/usdm/research_dataset/version=5f83d3d2f1d74139/dataset.json

feature_set:
  name: phase3_baseline_features
  version: "1"

label:
  name: gross_forward_return_1h
  version: "1"
  horizon_minutes: 60

strategy:
  name: multi_horizon_trend
  version: "1"
  fixed:
    short_lookback_hours: 72
    medium_lookback_hours: 336
    long_lookback_hours: 720
  grid:
    short_weight: [0.20, 0.30]
    medium_weight: [0.30, 0.40]
    long_weight: [0.30, 0.40, 0.50]

portfolio:
  name: buffered_long_flat
  version: "1"
  fixed:
    signal_threshold: 0.0
    rebalance_interval_hours: 72
    gross_exposure: 0.50
    annual_volatility_target: 0.15
    max_symbol_weight: 0.25

execution:
  name: bar_next_open
  version: "1"
  fixed: {}

costs:
  name: configured_taker
  version: "1"
  fixed:
    cost_multiplier: 1.0

validation:
  profile: discovery
  split_plan: expanding_walk_forward_v1
  train_days: 365
  test_days: 14
  embargo_bars: 1
  stress_cost_multipliers: [1.5]
  stress_signal_delay_bars: [1]
  require_parameter_sum:
    fields:
      - short_weight
      - medium_weight
      - long_weight
    equals: 1.0

runner:
  max_workers: 4
  fail_fast: false
  resume: true
