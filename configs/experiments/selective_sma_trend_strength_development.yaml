campaign:
  name: selective_sma_trend_strength_v1_development
  description: >-
    Development-only screen ending before the final two-year OOS. The raw 12-hour versus 168-hour
    SMA spread controls whether a fixed daily buffered neutral portfolio is active. Six thresholds
    and hysteresis combinations are preserved as exploratory evidence.
  hypothesis_id: HYP-SELECTIVE-SMA-STRENGTH-0001
  artifact_policy: summary
  max_trials: 6

dataset:
  manifest: var/data/gold/binance/usdm/research_dataset/version=5f83d3d2f1d74139/dataset.json

feature_set:
  name: phase3_baseline_features
  version: "1"

label:
  name: gross_forward_return_1h
  version: "1"
  horizon_minutes: 60

strategy:
  name: sma_trend_strength
  version: "1"
  fixed:
    fast_window_hours: 12
    slow_window_hours: 168

portfolio:
  name: buffered_neutral_long_short
  version: "1"
  fixed:
    rebalance_interval_hours: 24
    gross_exposure: 0.50
    annual_volatility_target: 0.15
    max_symbol_weight: 0.25
  grid:
    minimum_score_spread: [0.025, 0.050, 0.080]
    no_trade_score_band: [0.000, 0.010]

execution:
  name: bar_next_open
  version: "1"
  fixed: {}

costs:
  name: configured_taker
  version: "1"
  fixed:
    cost_multiplier: 1.0

validation:
  profile: discovery
  split_plan: expanding_walk_forward_v1
  train_days: 365
  test_days: 14
  embargo_bars: 1
  stress_cost_multipliers: [1.5]
  stress_signal_delay_bars: [1]

runner:
  max_workers: 4
  fail_fast: false
  resume: true
