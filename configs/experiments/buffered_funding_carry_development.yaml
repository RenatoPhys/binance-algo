campaign:
  name: buffered_funding_carry_v1_development
  description: >-
    Development-only low-turnover funding-carry screen ending before the final two-year OOS.
    Rebalance intervals are aligned to one, three or six conventional eight-hour funding cycles.
  hypothesis_id: HYP-BUFFERED-FUNDING-CARRY-0001
  artifact_policy: summary
  max_trials: 6

dataset:
  manifest: var/data/gold/binance/usdm/research_dataset/version=5f83d3d2f1d74139/dataset.json

feature_set:
  name: phase3_baseline_features
  version: "1"

label:
  name: gross_forward_return_1h
  version: "1"
  horizon_minutes: 60

strategy:
  name: funding_carry
  version: "1"
  fixed:
    funding_rate_weight: 1.0
    funding_change_weight: 0.0
    momentum_confirmation_weight: 0.25

portfolio:
  name: buffered_neutral_long_short
  version: "1"
  fixed:
    minimum_score_spread: 0.0
    gross_exposure: 0.50
    annual_volatility_target: 0.15
    max_symbol_weight: 0.25
  grid:
    rebalance_interval_hours: [8, 24, 48]
    no_trade_score_band: [0.50, 1.00]

execution:
  name: bar_next_open
  version: "1"
  fixed: {}

costs:
  name: configured_taker
  version: "1"
  fixed:
    cost_multiplier: 1.0

validation:
  profile: discovery
  split_plan: expanding_walk_forward_v1
  train_days: 365
  test_days: 14
  embargo_bars: 1
  stress_cost_multipliers: [1.5]
  stress_signal_delay_bars: [1]

runner:
  max_workers: 4
  fail_fast: false
  resume: true
