feature_set_id: alpha_reboot_features:v1
version: v1
description: >-
  Wave 1 alpha-reboot features. Baseline outputs are reused without numerical changes and new
  causal clock-phase, aggressive-flow, path-state, and pair-level bundles are added explicitly.

outputs:
  - log_return_5m
  - log_return_15m
  - log_return_1h
  - log_return_4h
  - log_return_24h
  - realized_volatility_24h
  - intraday_range_4h
  - quote_volume_1h
  - quote_volume_zscore_24h
  - taker_buy_imbalance_1h
  - benchmark_return_1h
  - rolling_beta
  - residual_momentum_1h
  - residual_momentum_4h
  - residual_momentum_24h
  - market_volatility_regime
  - funding_rate_current
  - funding_rate_change
  - quarter_open_signed_flow_1h
  - quarter_open_quote_volume_1h
  - quarter_open_flow_share_1h
  - non_open_flow_share_1h
  - quarter_flow_excess_1h
  - quarter_open_return_1h
  - quarter_open_flow_z_168h
  - quarter_flow_excess_z_168h
  - signed_taker_flow_share_1h
  - signed_taker_flow_z_168h
  - hourly_volatility_proxy
  - vol_scaled_return_1h
  - flow_price_agreement_1h
  - realized_volatility_4h
  - realized_volatility_168h
  - volatility_compression_4h_168h
  - prior_high_72h
  - prior_low_72h
  - range_position_72h
  - efficiency_ratio_24h
  - log_close_level

bundles:
  - bundle_id: returns_momentum
    version: v1
    outputs:
      - log_return_5m
      - log_return_15m
      - log_return_1h
      - log_return_4h
      - log_return_24h
      - benchmark_return_1h
      - rolling_beta
      - residual_momentum_1h
      - residual_momentum_4h
      - residual_momentum_24h
    parameters:
      horizons_minutes: [5, 15, 60, 240, 1440]
      beta_window_hours: $research.beta_window_hours
    output_parameters:
      rolling_beta:
        beta_window_hours: $research.beta_window_hours

  - bundle_id: volatility
    version: v1
    outputs:
      - realized_volatility_24h
      - intraday_range_4h
      - market_volatility_regime

  - bundle_id: volume
    version: v1
    outputs:
      - quote_volume_1h
      - quote_volume_zscore_24h

  - bundle_id: microstructure
    version: v1
    outputs:
      - taker_buy_imbalance_1h

  - bundle_id: funding
    version: v1
    outputs:
      - funding_rate_current
      - funding_rate_change

  - bundle_id: clock_phase
    version: v1
    outputs:
      - quarter_open_signed_flow_1h
      - quarter_open_quote_volume_1h
      - quarter_open_flow_share_1h
      - non_open_flow_share_1h
      - quarter_flow_excess_1h
      - quarter_open_return_1h
      - quarter_open_flow_z_168h
      - quarter_flow_excess_z_168h

  - bundle_id: flow
    version: v1
    outputs:
      - signed_taker_flow_share_1h
      - signed_taker_flow_z_168h
      - hourly_volatility_proxy
      - vol_scaled_return_1h
      - flow_price_agreement_1h

  - bundle_id: path_state
    version: v1
    outputs:
      - realized_volatility_4h
      - realized_volatility_168h
      - volatility_compression_4h_168h
      - prior_high_72h
      - prior_low_72h
      - range_position_72h
      - efficiency_ratio_24h

  - bundle_id: pair_state
    version: v1
    outputs:
      - log_close_level
